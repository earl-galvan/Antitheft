name: Antitheft
version: "${version}"
main: io.github.earlgalvan.antitheft.AntitheftPlugin
description: Lock chests and other storage blocks against other players.
author: earl-galvan
api-version: '1.18'
folia-supported: true

commands:
  lock:
    description: Lock the block you are looking at, or manage who can use it. /lock help lists everything.
    usage: /lock [help | add <player> | remove <player> | give ownership <player> | remove ownership <player> | admin-unlock]
    permission: antitheft.lock
  unlock:
    description: Unlock the block you are looking at.
    usage: /unlock
    permission: antitheft.unlock
  lockinfo:
    description: Show who owns the block you are looking at.
    usage: /lockinfo
    permission: antitheft.lockinfo
  trust:
    description: Let a player open (or, with ownership, co-own) all of your locks, including future ones.
    usage: /trust [ownership] <player>
    permission: antitheft.trust
  untrust:
    description: Remove a player from your trust or co-owner list.
    usage: /untrust [ownership] <player>
    permission: antitheft.untrust
  trustlist:
    description: List the players you trust and your global co-owners.
    usage: /trustlist
    permission: antitheft.trustlist
  antitheft:
    description: Antitheft admin commands.
    usage: /antitheft reload
    permission: antitheft.reload

permissions:
  antitheft.lock:
    description: Use /lock, /lock help, /lock add, /lock remove and /lock give ownership.
    default: true
  antitheft.unlock:
    description: Use /unlock.
    default: true
  antitheft.lockinfo:
    description: Use /lockinfo.
    default: true
  antitheft.trust:
    description: Use /trust and /trust ownership.
    default: true
  antitheft.untrust:
    description: Use /untrust and /untrust ownership.
    default: true
  antitheft.trustlist:
    description: Use /trustlist.
    default: true
  antitheft.reload:
    description: Use /antitheft reload.
    default: op
  antitheft.adminunlock:
    description: Use /lock admin-unlock to remove anyone's lock.
    default: op
  antitheft.bypass:
    description: Open and break any locked block.
    default: op
