# MiniMessage format: https://docs.advntr.dev/minimessage/format.html
# Leave a message empty ("") to not send it.
prefix: "<dark_gray>[<gold>Antitheft</gold>]</dark_gray> "

no-permission: "<red>You don't have permission to do that."
players-only: "<red>Only players can use this command."
no-target: "<red>Look at a lockable block within 5 blocks."
not-lockable: "<red>That block can't be locked."
not-locked: "<red>That block isn't locked."
not-owner: "<red>Only the owner can do that."
locked: "<green>Block locked."
auto-locked: "<gray>Block locked automatically. Use /unlock to remove the lock."
already-locked-self: "<yellow>You already own the lock on this block."
already-locked-other: "<red>This block is already locked by <owner>."
unlocked: "<green>Lock removed."
admin-unlocked: "<green>Removed <owner>'s lock."
access-added: "<green><player> can now open this block."
access-removed: "<green><player> can no longer open this block."
access-already: "<yellow><player> already has access."
access-missing: "<yellow><player> doesn't have access to this block."
ownership-given: "<green><player> now owns this block."
cannot-target-self: "<red>You can't do that to yourself."
unknown-player: "<red>No player named <player> has joined this server."
denied-open: "<red>This block is locked by <owner>."
denied-break: "<red>This block is locked by <owner>. Only the owner can break it."
denied-connect: "<red>You can't connect a chest to <owner>'s locked chest."
info-owner: "<gold>Owner: <white><owner>"
info-access: "<gold>Access: <white><list>"
info-none: "none"
trusted: "<green><player> can now open all of your locks."
untrusted: "<green><player> was removed from your trust list."
trust-already: "<yellow>You already trust <player>."
trust-missing: "<yellow>You don't trust <player>."
trustlist: "<gold>Trusted players: <white><list>"
trustlist-empty: "<gray>You don't trust anyone yet."
reloaded: "<green>Antitheft config and messages reloaded."
usage-lock: "<red>Usage: /lock [add <player> | remove <player> | give <player> | admin-unlock]"
usage-trust: "<red>Usage: /<command> <player>"
usage-antitheft: "<red>Usage: /antitheft reload"
